<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Скільки годин лишилось у дні і куди пішов час">
  <title>Бюджет часу</title>

  <!-- Встановлення на головний екран телефона (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Бюджет часу">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="dialog"></dialog>
  <!-- Невидиме поле вибору файлу для «Імпортувати дані».
       Без фільтра за типом: деякі телефони інакше «не бачать» файл копії -->
  <input type="file" id="import-file" hidden>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="wrap">Щоб «Бюджет часу» працював, увімкни JavaScript у браузері.</p></noscript>

  <!-- Порядок важливий: кожен наступний файл користується попередніми -->
  <script src="js/time.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
